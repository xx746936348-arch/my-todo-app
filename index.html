<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#FDF8EE" />
<title>今日清单</title>

<!-- ====== PWA 标识 ====== -->
<link rel="manifest" href="manifest.webmanifest">

<!-- iOS 主屏：让它像 App 一样无浏览器外壳 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今日清单">
<meta name="format-detection" content="telephone=no">

<!-- 图标 -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<!-- 手写体（中文 + 英文） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Long+Cang&family=Liu+Jian+Mao+Cao&family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&family=Caveat:wght@400;700&display=swap" rel="stylesheet">

<style>
  /* ==================== 调色 ==================== */
  :root {
    --paper:      #FDF8EE;
    --paper-2:    #F6EFDE;
    --paper-3:    #ECE3CC;
    --ink:        #1A1A1A;
    --ink-soft:   #5A5A5A;
    --ink-faint:  #9A9A9A;
  }

  /* ==================== 基础 ==================== */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    color: var(--ink);
    /* 优先 Google 手写体 → iOS 内置手写/楷体 → 通用兜底 */
    font-family: "Long Cang", "Liu Jian Mao Cao", "ZCOOL KuaiLe",
                 "Ma Shan Zheng", "Caveat",
                 "Hannotate SC", "Hannotate TC", "Yuanti SC",
                 "Kaiti SC", "STKaiti", "KaiTi",
                 "Comic Sans MS", cursive, sans-serif;
    background: var(--paper);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body {
    /* 顶部至少留 18px，刘海机型用更大的 safe-area-inset-top */
    padding-top: max(env(safe-area-inset-top), 18px);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    padding-bottom: calc(120px + env(safe-area-inset-bottom));
    position: relative;
    background-image:
      linear-gradient(rgba(154, 154, 154, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(154, 154, 154, 0.04) 1px, transparent 1px);
    background-size: 22px 22px;
    background-color: var(--paper);
    background-attachment: fixed;
  }

  /* 纸张噪点 */
  body::before {
    content: "";
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.4 0 0 0 0 0.36 0 0 0 0 0.3 0 0 0 0.06 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    opacity: 0.5;
    mix-blend-mode: multiply;
  }

  /* ==================== 容器 ==================== */
  .app {
    position: relative;
    z-index: 1;
    max-width: 460px;
    margin: 0 auto;
    padding: 22px 18px 12px;
  }

  /* ==================== 通用：手绘边框 ==================== */
  /* 用 ::before 画一层有 filter 的"颤抖边框"，文字保持清晰 */
  .sk {
    position: relative;
  }
  .sk::before {
    content: "";
    position: absolute;
    inset: 0;
    border: 2px solid var(--ink);
    border-radius: 14px 18px 12px 16px / 16px 12px 18px 14px;
    background: transparent;
    filter: url(#wobble);
    pointer-events: none;
    z-index: -1;
  }
  /* 实心填充版（按钮/印章） */
  .sk-solid::before {
    background: var(--ink);
  }

  /* ==================== 顶栏 ==================== */
  header {
    text-align: center;
    margin-bottom: 18px;
    padding-top: 12px;
    position: relative;
  }
  .header-doodle {
    display: block;
    margin: 0 auto 4px;
    width: 90px; height: 80px;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 36px;
    font-weight: 400;
    letter-spacing: 4px;
    color: var(--ink);
    /* 字体跟随 body，与任务文字一致 */
    line-height: 1.1;
    transform: rotate(-1deg);
  }
  header .en {
    display: block;
    font-size: 13px;
    color: var(--ink-soft);
    margin-top: 2px;
    font-family: "Caveat", "Bradley Hand", "Marker Felt", cursive;
    letter-spacing: 1.5px;
    transform: rotate(0.5deg);
  }
  header .date {
    font-size: 17px;
    color: var(--ink-soft);
    margin-top: 6px;
    letter-spacing: 1.5px;
    font-family: "Long Cang", "Liu Jian Mao Cao", "Hannotate SC", "Yuanti SC", "Kaiti SC", "STKaiti", "KaiTi", cursive;
  }
  header .date-stripe {
    display: inline-block;
    padding: 2px 14px;
    position: relative;
    margin-top: 4px;
  }

  /* ==================== 屏幕切换 ==================== */
  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }

  /* ==================== 卡片 ==================== */
  .card {
    padding: 18px 16px;
    margin-bottom: 18px;
    background: transparent;
    transform: rotate(-0.3deg);
  }
  .card + .card { transform: rotate(0.3deg); }

  /* ==================== 输入栏 ==================== */
  .add-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .add-row .input-wrap {
    flex: 1;
    padding: 4px 12px;
    cursor: text;
    isolation: isolate;             /* 隔离 ::before 的 z-index 影响 */
  }
  .add-row input[type="text"] {
    width: 100%;
    border: none;
    background: transparent;
    padding: 10px 4px;
    font-size: 20px;
    outline: none;
    color: var(--ink);
    font-family: inherit;
    letter-spacing: 1px;
    position: relative;             /* 配合 z-index 兜底 */
    z-index: 2;
    cursor: text;
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }
  /* 工具页的两个数字输入框，同样兜底 */
  .range-input-wrap {
    isolation: isolate;
  }
  .range-input-wrap input {
    position: relative;
    z-index: 2;
    cursor: text;
    -webkit-user-select: text;
    user-select: text;
  }
  .add-row input[type="text"]::placeholder {
    color: var(--ink-faint);
    font-style: italic;
  }

  /* ==================== 按钮 ==================== */
  .btn {
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: transform 0.08s;
    -webkit-user-select: none; user-select: none;
    background: transparent;
    color: var(--ink);
    padding: 10px 18px;
    font-size: 20px;
    letter-spacing: 2px;
    position: relative;
  }
  .btn:active { transform: scale(0.96); }

  /* 实心填充按钮（背景黑色，字白色） */
  .btn-fill {
    color: var(--paper);
    padding: 12px 22px;
    font-size: 22px;
    transform: rotate(-1deg);
  }
  .btn-primary.large {
    width: 100%;
    padding: 18px;
    font-size: 28px;
    letter-spacing: 6px;
  }

  /* ==================== 任务列表 ==================== */
  .task-list { list-style: none; padding: 0; margin: 0; }
  .task-item {
    display: flex;
    align-items: center;
    padding: 8px 0;
    margin-bottom: 8px;
    gap: 10px;
    transition: opacity 0.2s;
  }
  .task-item.done { opacity: 0.45; }
  .task-item.done .task-text {
    text-decoration: line-through;
    text-decoration-color: var(--ink);
    text-decoration-thickness: 2px;
    color: var(--ink-soft);
  }

  /* 编号方框 */
  .task-num {
    flex-shrink: 0;
    width: 34px; height: 34px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    font-weight: 400;
    color: var(--ink);
    font-family: "Caveat", "Long Cang", "Hannotate SC", "Yuanti SC", "Kaiti SC", "STKaiti", cursive;
    position: relative;
    transform: rotate(-2deg);
  }

  /* 中间文本框 */
  .task-text {
    flex: 1;
    font-size: 22px;
    line-height: 1.4;
    word-break: break-word;
    padding: 10px 14px;
    cursor: text;
    min-height: 46px;
    display: flex;
    align-items: center;
    color: var(--ink);
    letter-spacing: 1px;
    transition: background 0.15s;
    position: relative;
  }
  .task-text[contenteditable="true"] {
    outline: none;
  }
  .task-text[contenteditable="true"]::before {
    border-width: 2.5px !important;
    border-color: var(--ink) !important;
    background: rgba(255, 255, 220, 0.5) !important;
  }

  /* 右侧完成圆圈 */
  .task-check {
    flex-shrink: 0;
    width: 34px; height: 34px;
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: transparent;
    font-size: 24px;
    transition: color 0.2s;
    padding: 0; line-height: 1;
    position: relative;
    border: none;
    font-family: "Long Cang", "Hannotate SC", "Yuanti SC", "Kaiti SC", "STKaiti", cursive;
  }
  .task-check::before {
    content: "";
    position: absolute;
    inset: 0;
    border: 2px solid var(--ink);
    border-radius: 50% 48% 52% 50% / 50% 52% 48% 50%;
    filter: url(#wobble);
  }
  .task-check:active { transform: scale(0.88); }
  .task-item.done .task-check {
    color: var(--ink);
  }
  .task-item.done .task-check::before {
    background: var(--ink);
  }
  .task-item.done .task-check {
    color: var(--paper);
  }

  /* 空状态 */
  .empty-state {
    text-align: center;
    padding: 30px 12px;
    color: var(--ink-soft);
    font-size: 22px;
    letter-spacing: 2px;
  }
  .empty-state svg {
    display: block;
    margin: 0 auto 10px;
  }

  /* ==================== 今日操作按钮 ==================== */
  .today-actions {
    display: flex;
    gap: 12px;
    margin: 18px 0 8px;
  }
  .today-actions .btn {
    flex: 1;
    padding: 13px 8px;
    font-size: 18px;
    letter-spacing: 1px;
    text-align: center;
    color: var(--ink);
    transform: rotate(-0.3deg);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .today-actions .btn:nth-child(2) { transform: rotate(0.3deg); }
  .today-actions .btn.btn-danger { color: var(--ink); }
  .today-actions .btn.btn-danger:active { color: #B5443A; }
  .btn-doodle {
    flex-shrink: 0;
    filter: url(#wobble);
  }

  /* 历史复制按钮 */
  .history-day-footer {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--ink-faint);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  .history-copy-btn,
  .history-del-btn {
    background: transparent;
    border: none;
    color: var(--ink);
    font-family: inherit;
    font-size: 16px;
    padding: 8px 14px;
    cursor: pointer;
    letter-spacing: 1px;
    position: relative;
    transition: opacity 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .history-copy-btn:active,
  .history-del-btn:active { opacity: 0.6; }
  .history-del-btn { color: var(--ink-soft); }
  .history-del-btn:hover { color: #B5443A; }

  /* ==================== 抽签页 ==================== */
  .lottery-stage {
    text-align: center;
    padding: 16px 10px 8px;
  }
  .lottery-display {
    min-height: 180px;
    margin: 16px 0 22px;
    padding: 28px 22px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .lottery-display .small {
    font-size: 18px;
    color: var(--ink-soft);
    margin-bottom: 14px;
    letter-spacing: 6px;
  }
  .lottery-display .task-pick {
    font-size: 30px;
    font-weight: 400;
    color: var(--ink);
    line-height: 1.5;
    letter-spacing: 3px;
    max-width: 92%;
    /* 字体跟随 body —— 与任务列表里的文字保持一致 */
  }
  .lottery-display.spinning .task-pick {
    animation: shake 0.06s ease-in-out infinite;
  }
  @keyframes shake {
    0%   { transform: translateX(-2px) rotate(-1deg);}
    50%  { transform: translateX(2px)  rotate(1deg);}
    100% { transform: translateX(-2px) rotate(-1deg);}
  }
  .lottery-actions {
    display: flex; flex-direction: column; gap: 12px;
    margin-top: 8px;
  }

  /* ==================== 工具页：随机数字 ==================== */
  .tools-stage {
    padding: 4px 8px;
  }
  .tools-hint {
    text-align: center;
    font-size: 15px;
    color: var(--ink-soft);
    margin: 2px 0 14px;
    letter-spacing: 2px;
  }
  .random-range {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 2px 0 12px;
  }
  .range-input-wrap {
    flex: 0 0 auto;
    width: 96px;
    padding: 2px 12px;
    position: relative;
  }
  .range-input-wrap input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 22px;
    text-align: center;
    color: var(--ink);
    letter-spacing: 1px;
    padding: 4px 0;
    -moz-appearance: textfield;
  }
  .range-input-wrap input::-webkit-outer-spin-button,
  .range-input-wrap input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .range-sep {
    font-size: 18px;
    color: var(--ink-soft);
    letter-spacing: 1px;
  }
  .random-display {
    min-height: 130px;
    margin: 10px 0 14px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .random-display .small {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 8px;
    letter-spacing: 5px;
  }
  .random-display .random-number {
    font-size: 56px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1;
    font-family: "Caveat", "Long Cang", "Hannotate SC", "Yuanti SC", "Kaiti SC", "STKaiti", cursive;
  }
  .random-display.spinning .random-number {
    animation: shake 0.06s ease-in-out infinite;
  }
  /* 工具页的生成按钮：比签筒的"抽签"小一档，省竖向空间 */
  #genNumberBtn {
    padding: 12px 18px;
    font-size: 20px;
    letter-spacing: 4px;
  }

  /* ==================== 历史 ==================== */
  .history-day {
    margin-bottom: 16px;
    padding: 14px 18px;
    position: relative;
    transform: rotate(-0.3deg);
  }
  .history-day + .history-day { transform: rotate(0.3deg); }
  .history-day h3 {
    margin: 0 0 10px;
    font-size: 22px;
    color: var(--ink);
    display: flex;
    justify-content: space-between;
    align-items: center;
    letter-spacing: 2px;
    font-weight: 400;
    padding-bottom: 6px;
    border-bottom: 2px dashed var(--ink);
    /* 字体跟随 body */
  }
  .history-day .stat {
    font-size: 16px;
    color: var(--ink-soft);
    letter-spacing: 1px;
    font-family: "Caveat", "Long Cang", "Hannotate SC", "Yuanti SC", "Kaiti SC", "STKaiti", cursive;
  }
  .history-day ul { margin: 0; padding-left: 4px; list-style: none; }
  .history-day li {
    font-size: 19px;
    padding: 4px 0;
    color: var(--ink);
    letter-spacing: 1px;
    position: relative;
    padding-left: 22px;
  }
  .history-day li::before {
    content: "○";
    position: absolute;
    left: 0;
    color: var(--ink);
    font-size: 16px;
    font-family: "Long Cang", "Hannotate SC", "Yuanti SC", "Kaiti SC", "STKaiti", cursive;
  }
  .history-day li.done {
    color: var(--ink-soft);
    text-decoration: line-through;
    text-decoration-thickness: 1.5px;
  }
  .history-day li.done::before {
    content: "●";
  }

  /* ==================== 底部标签 ==================== */
  nav.tabs {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--paper);
    border-top: 2px solid var(--ink);
    display: flex;
    justify-content: space-around;
    padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
    z-index: 50;
    filter: url(#wobble-soft);
  }
  nav.tabs button {
    flex: 1;
    background: transparent;
    border: none;
    padding: 4px;
    color: var(--ink-soft);
    font-size: 16px;
    letter-spacing: 3px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    transition: color 0.2s;
    position: relative;
    font-family: inherit;
  }
  nav.tabs button .ico {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
  }
  nav.tabs button.active {
    color: var(--ink);
  }
  nav.tabs button.active::after {
    content: "";
    position: absolute;
    bottom: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 30px; height: 2px;
    background: var(--ink);
    border-radius: 2px;
  }
  nav.tabs button.active .ico svg {
    stroke: var(--ink);
  }
  nav.tabs button .ico svg {
    stroke: var(--ink-soft);
    transition: stroke 0.2s;
  }

  /* ==================== 弹窗 ==================== */
  .modal-bg {
    position: fixed; inset: 0;
    background: rgba(26, 26, 26, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 18px;
    animation: fadeIn 0.2s ease;
  }
  .modal-bg.active { display: flex; }
  .modal {
    padding: 26px 22px 22px;
    width: 100%;
    max-width: 380px;
    position: relative;
    background: transparent;
    transform: rotate(-0.5deg);
  }
  .modal::before {
    background: var(--paper);
    border-width: 2.5px !important;
  }
  .modal h2 {
    margin: 0 0 6px;
    font-size: 30px;
    color: var(--ink);
    text-align: center;
    letter-spacing: 5px;
    font-weight: 400;
    font-family: "Liu Jian Mao Cao", "Long Cang", "Hannotate SC", "Yuanti SC", "Kaiti SC", "STKaiti", cursive;
    transform: rotate(0.8deg);
  }
  .modal .modal-sub {
    margin: 4px 0 18px;
    color: var(--ink-soft);
    text-align: center;
    font-size: 17px;
    letter-spacing: 2px;
  }
  .modal-options { display: flex; flex-direction: column; gap: 12px; }
  .modal-options button {
    text-align: left;
    background: transparent;
    border: none;
    padding: 14px 16px 14px 46px;
    font-size: 19px;
    color: var(--ink);
    cursor: pointer;
    line-height: 1.45;
    letter-spacing: 1.5px;
    font-family: inherit;
    position: relative;
    transition: opacity 0.15s;
  }
  .modal-options button::after {
    content: attr(data-num);
    position: absolute;
    left: 12px; top: 50%;
    transform: translate(0, -50%) rotate(-3deg);
    font-size: 22px;
    color: var(--ink);
    font-family: "Caveat", "Long Cang", "Hannotate SC", "Yuanti SC", "Kaiti SC", "STKaiti", cursive;
    font-weight: 700;
  }
  .modal-options button .opt-sub {
    display: block;
    font-size: 15px;
    color: var(--ink-soft);
    margin-top: 2px;
    letter-spacing: 1px;
  }
  .modal-options .opt-frame {
    position: relative;
  }
  .modal-options .opt-frame::before {
    border-radius: 12px 16px 14px 10px / 14px 10px 16px 12px;
  }
  .modal-options .opt-frame:active { opacity: 0.7; }

  /* ==================== 确认弹窗按钮 ==================== */
  .modal-actions {
    display: flex;
    gap: 12px;
    margin-top: 18px;
  }
  .modal-actions .btn {
    flex: 1;
    padding: 12px 6px;
    font-size: 18px;
    text-align: center;
    color: var(--ink);
    letter-spacing: 1.5px;
    transform: rotate(-0.3deg);
  }
  .modal-actions .btn:nth-child(2) { transform: rotate(0.3deg); }
  .modal-actions .btn-confirm-ok { font-weight: 700; }

  /* ==================== 提示条 ==================== */
  .toast {
    position: fixed;
    bottom: 110px;
    left: 50%;
    transform: translateX(-50%) translateY(20px) rotate(-1deg);
    background: var(--ink);
    color: var(--paper);
    padding: 10px 22px;
    border-radius: 30px 20px 24px 28px;
    font-size: 18px;
    letter-spacing: 3px;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 200;
    font-family: inherit;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) rotate(-1deg);
  }
</style>

<!-- 通用确认弹窗（App 风格） -->
<div class="modal-bg" id="confirmModal">
  <div class="modal sk">
    <h2 id="confirmTitle">确认</h2>
    <p class="modal-sub" id="confirmMessage">是否继续？</p>
    <div class="modal-actions">
      <button class="btn sk" id="confirmCancelBtn">取消</button>
      <button class="btn sk btn-confirm-ok" id="confirmOkBtn">确定</button>
    </div>
  </div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   每日抽签待办（手绘速写本风格）
   ========================================================= */
const STORAGE_KEY   = "dlt_days";      // 当前工作中的今日清单
const WEEKDAYS = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function prettyDate(s) {
  if (!s) return "";
  const [y,m,d] = s.split("-").map(Number);
  const dt = new Date(y, m-1, d);
  return `${m}/${d}  ${WEEKDAYS[dt.getDay()]}`;
}
function loadAll() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e) { return {}; }
}
function saveAll(d) { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }
function getTasks(date) { return loadAll()[date] || []; }
function setTasks(date, tasks) {
  const all = loadAll(); all[date] = tasks; saveAll(all);
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}

/* ---------- 跨天自动重置 done 标记 ---------- */
/*  数据模型：dlt_days[YYYY-MM-DD] = [tasks]，始终只保留"今日这一份"。
    如果发现储存里的日期不是今日，就把那份清单带到今日、所有 done 全部重置为 false，
    任务文字与顺序保持不变。 */
function rolloverIfNewDay() {
  const all = loadAll();
  const today = todayStr();
  const dates = Object.keys(all).sort();
  if (dates.length === 0) return;

  // 今日已存在条目：清掉所有非今日的旧条目就好
  if (all[today] !== undefined) {
    let changed = false;
    dates.forEach(d => {
      if (d !== today) { delete all[d]; changed = true; }
    });
    if (changed) saveAll(all);
    return;
  }

  // 今日还没有条目：把最近一天的任务搬过来、done 全部重置
  const mostRecent = dates[dates.length - 1];
  const oldTasks = all[mostRecent] || [];
  const resetTasks = oldTasks.map(t => ({ ...t, done: false }));
  saveAll({ [today]: resetTasks });
}

async function clearTodayTasks() {
  const today = todayStr();
  const tasks = getTasks(today);
  if (tasks.length === 0) { toast("今日已经是空的~"); return; }
  const ok = await appConfirm(
    `确定要清空今日的 ${tasks.length} 件任务吗？清空之后无法恢复~`,
    { title: "清空清单", okText: "清空", cancelText: "取消" }
  );
  if (!ok) return;
  setTasks(today, []);
  renderToday();
  toast("今日已清空 ✓");
}

/* ---------- 工具页：随机数字 ---------- */
function generateRandomNumber() {
  const minEl = document.getElementById("rangeMin");
  const maxEl = document.getElementById("rangeMax");
  let min = parseInt(minEl.value, 10);
  let max = parseInt(maxEl.value, 10);
  if (isNaN(min) || isNaN(max)) { toast("请输入数字~"); return; }
  if (min > max) { [min, max] = [max, min]; minEl.value = min; maxEl.value = max; }

  const display = document.getElementById("randomDisplay");
  const text = document.getElementById("randomNumber");
  display.classList.add("spinning");
  const rand = () => Math.floor(Math.random() * (max - min + 1)) + min;
  let spins = 0; const total = 12;
  const interval = setInterval(() => {
    text.textContent = rand();
    spins++;
    if (spins >= total) {
      clearInterval(interval);
      display.classList.remove("spinning");
      text.textContent = rand();
    }
  }, 70);
}

let currentDate = todayStr();

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._tid);
  toast._tid = setTimeout(() => t.classList.remove("show"), 1800);
}

/* ---------- 自定义确认弹窗（替代浏览器原生 confirm()） ---------- */
function appConfirm(message, opts) {
  return new Promise(resolve => {
    const modal     = document.getElementById("confirmModal");
    const titleEl   = document.getElementById("confirmTitle");
    const msgEl     = document.getElementById("confirmMessage");
    const okBtn     = document.getElementById("confirmOkBtn");
    const cancelBtn = document.getElementById("confirmCancelBtn");
    const options = opts || {};

    titleEl.textContent = options.title    || "确认";
    msgEl.textContent   = message;
    okBtn.textContent   = options.okText   || "确定";
    cancelBtn.textContent = options.cancelText || "取消";

    function cleanup(result) {
      modal.classList.remove("active");
      okBtn.removeEventListener("click", onOk);
      cancelBtn.removeEventListener("click", onCancel);
      modal.removeEventListener("click", onBg);
      document.removeEventListener("keydown", onKey);
      resolve(result);
    }
    function onOk()     { cleanup(true); }
    function onCancel() { cleanup(false); }
    function onBg(e)    { if (e.target === modal) cleanup(false); }
    function onKey(e) {
      if (e.key === "Escape") cleanup(false);
      if (e.key === "Enter")  cleanup(true);
    }

    okBtn.addEventListener("click", onOk);
    cancelBtn.addEventListener("click", onCancel);
    modal.addEventListener("click", onBg);
    document.addEventListener("keydown", onKey);
    modal.classList.add("active");
  });
}
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}

function renderToday() {
  const list = document.getElementById("taskList");
  const empty = document.getElementById("todayEmpty");
  const tasks = getTasks(currentDate);
  list.innerHTML = "";
  if (tasks.length === 0) { empty.style.display = "block"; return; }
  empty.style.display = "none";
  tasks.forEach((task, idx) => {
    const li = document.createElement("li");
    li.className = "task-item" + (task.done ? " done" : "");
    li.dataset.id = task.id;
    li.innerHTML = `
      <div class="task-num">${idx + 1}.</div>
      <div class="task-text sk" data-id="${task.id}" data-action="edit" title="点击修改，清空文字即可删除">${escapeHtml(task.text)}</div>
      <button class="task-check" data-action="toggle" aria-label="完成">✓</button>
    `;
    list.appendChild(li);
  });
}

function addTask() {
  const input = document.getElementById("newTaskInput");
  const text = input.value.trim();
  if (!text) return;
  const tasks = getTasks(currentDate);
  tasks.push({ id: uid(), text, done: false });
  setTasks(currentDate, tasks);
  input.value = "";
  renderToday();
}
function toggleTask(id) {
  const tasks = getTasks(currentDate);
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  t.done = !t.done;
  setTasks(currentDate, tasks);
  renderToday();
}
function deleteTask(id) {
  let tasks = getTasks(currentDate);
  tasks = tasks.filter(t => t.id !== id);
  setTasks(currentDate, tasks);
  renderToday();
}
function startEdit(id) {
  const el = document.querySelector(`.task-text[data-id="${id}"]`);
  if (!el) return;
  el.setAttribute("contenteditable", "true");
  el.focus();
  const range = document.createRange();
  range.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges(); sel.addRange(range);
  function finish() {
    el.removeAttribute("contenteditable");
    el.removeEventListener("blur", finish);
    el.removeEventListener("keydown", onKey);
    const newText = el.textContent.trim();
    if (!newText) { deleteTask(id); return; }
    const tasks = getTasks(currentDate);
    const t = tasks.find(t => t.id === id);
    if (t) { t.text = newText; setTasks(currentDate, tasks); }
    renderToday();
  }
  function onKey(e) {
    if (e.key === "Enter") { e.preventDefault(); el.blur(); }
    if (e.key === "Escape") { e.preventDefault(); el.textContent = el.dataset.original || el.textContent; el.blur(); }
  }
  el.dataset.original = el.textContent;
  el.addEventListener("blur", finish);
  el.addEventListener("keydown", onKey);
}

let lotteryPicked = null;
function pickRandomTask() {
  const tasks = getTasks(currentDate);
  const unfinished = tasks.filter(t => !t.done);
  const display = document.getElementById("lotteryDisplay");
  const text = document.getElementById("lotteryText");
  const doneBtn = document.getElementById("doneBtn");
  if (unfinished.length === 0) {
    text.textContent = "今天的事都做完啦~";
    lotteryPicked = null;
    doneBtn.style.display = "none";
    return;
  }
  display.classList.add("spinning");
  doneBtn.style.display = "none";
  let spins = 0; const total = 10;
  const interval = setInterval(() => {
    const r = unfinished[Math.floor(Math.random() * unfinished.length)];
    text.textContent = r.text;
    spins++;
    if (spins >= total) {
      clearInterval(interval);
      display.classList.remove("spinning");
      const final = unfinished[Math.floor(Math.random() * unfinished.length)];
      text.textContent = final.text;
      lotteryPicked = final.id;
      doneBtn.style.display = "block";
    }
  }, 80);
}
function markPickedDone() {
  if (!lotteryPicked) return;
  toggleTask(lotteryPicked);
  toast("做完啦~");
  lotteryPicked = null;
  document.getElementById("doneBtn").style.display = "none";
  const remaining = getTasks(currentDate).filter(t => !t.done);
  if (remaining.length > 0) {
    setTimeout(pickRandomTask, 400);
  } else {
    document.getElementById("lotteryText").textContent = "今天的事都做完啦~";
  }
}


function updateHeaderDate() {
  document.getElementById("todayDate").textContent = prettyDate(currentDate);
}
const PAGE_TITLES = {
  today:   { zh: "今日清单", en: "Today's List" },
  lottery: { zh: "今日抽签", en: "Today's Lottery" },
  tools:   { zh: "工具",     en: "Tools" },
};
function switchTab(name) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById("screen-" + name).classList.add("active");
  document.querySelectorAll("nav.tabs button").forEach(b => {
    b.classList.toggle("active", b.dataset.tab === name);
  });
  // 切换大标题
  const t = PAGE_TITLES[name];
  if (t) {
    document.getElementById("pageTitle").textContent = t.zh;
    document.getElementById("pageTitleEn").textContent = t.en;
  }
  if (name === "today") renderToday();
}

/* ---------- 示例数据 ---------- */
function dateNDaysAgo(n) {
  const d = new Date();
  d.setDate(d.getDate() - n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

document.addEventListener("DOMContentLoaded", () => {
  // 老版本残留数据清理（迁移）
  localStorage.removeItem("dlt_history");
  localStorage.removeItem("dlt_lastDate");

  currentDate = todayStr();
  rolloverIfNewDay();  // 跨天 → 把上一份带到今日，done 全部重置
  updateHeaderDate();
  renderToday();

  document.getElementById("addTaskBtn").addEventListener("click", addTask);
  document.getElementById("newTaskInput").addEventListener("keydown", e => {
    if (e.key === "Enter") addTask();
  });

  // iOS PWA：点包装层时强制聚焦内部 input（修一个偶发的"键盘不弹出"bug）
  document.querySelectorAll(".input-wrap, .range-input-wrap").forEach(wrap => {
    wrap.addEventListener("click", e => {
      if (e.target.tagName === "INPUT") return; // 直接点到 input 就不用再 focus 一次
      const input = wrap.querySelector("input");
      if (input) input.focus();
    });
  });
  document.getElementById("taskList").addEventListener("click", e => {
    if (e.target.getAttribute("contenteditable") === "true") return;
    const trigger = e.target.closest("[data-action]");
    if (!trigger) return;
    const li = e.target.closest(".task-item");
    if (!li) return;
    const id = li.dataset.id;
    const action = trigger.dataset.action;
    if (action === "toggle") toggleTask(id);
    else if (action === "edit") startEdit(id);
    else if (action === "delete") deleteTask(id);
  });
  document.getElementById("pickBtn").addEventListener("click", pickRandomTask);
  document.getElementById("doneBtn").addEventListener("click", markPickedDone);

  // 今日：清空清单
  document.getElementById("clearTodayBtn").addEventListener("click", clearTodayTasks);

  // 工具页：随机数字生成
  document.getElementById("genNumberBtn").addEventListener("click", generateRandomNumber);

  document.querySelectorAll("nav.tabs button").forEach(b => {
    b.addEventListener("click", () => switchTab(b.dataset.tab));
  });

  // 跨午夜：日期变了 → 自动重置 done 标记 + 刷新视图
  setInterval(() => {
    const t = todayStr();
    if (t !== currentDate) {
      currentDate = t;
      rolloverIfNewDay();
      updateHeaderDate();
      renderToday();
    }
  }, 60 * 1000);
});

/* ---------- PWA: 注册 Service Worker ---------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(err =>
      console.warn("Service Worker 注册失败:", err)
    );
  });
}
</script>
